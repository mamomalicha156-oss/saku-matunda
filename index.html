<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saku Grocery — Fresh food, delivered</title>

  <!-- Fraunces for headlines (a farm-stand, characterful serif),
       Inter for everything else. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- The entire app renders into this single mount point. -->
  <div id="app"></div>

  <!--
    Plain scripts (not ES modules) loaded in dependency order, so they
    can be opened straight from disk via file:// without a local server.
    They share one global scope on purpose — every render-*.js file
    calls straight into state.js and utils.js without any imports.
  -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render-shell.js"></script>
  <script src="js/render-shop.js"></script>
  <script src="js/render-auth.js"></script>
  <script src="js/render-checkout.js"></script>
  <script src="js/render-admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
